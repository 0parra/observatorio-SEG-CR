name: Validación de datos SUGESE
on:
  push:
    paths:
      - "data/**"
      - "scripts/validar_datos.py"
      - ".github/workflows/validacion.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar integridad y conciliaciones
        run: python scripts/validar_datos.py
