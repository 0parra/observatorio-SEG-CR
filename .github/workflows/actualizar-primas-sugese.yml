name: Actualizar primas oficiales SUGESE
on:
  push:
    paths:
      - "scripts/extraer_powerbi_publico.py"
      - ".github/workflows/actualizar-primas-sugese.yml"
  workflow_dispatch:
  schedule:
    # 07:45 hora de Costa Rica; comprobación diaria, no publicación diaria.
    - cron: "45 13 * * *"
permissions:
  contents: write
concurrency:
  group: publicar-primas-sugese
  cancel-in-progress: false
jobs:
  extraer-y-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de lectura pública
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Consultar tabla pública y verificar total de primas
        run: python scripts/extraer_powerbi_publico.py
      - name: Publicar serie si las cifras oficiales cambiaron
        run: |
          if [ -f data/series_powerbi.json ] && ! git diff --quiet -- data/series_powerbi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/series_powerbi.json
            git commit -m "Sincroniza primas oficiales SUGESE por ramo [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No hay nueva publicación; se conserva la última serie validada."
          fi
      - name: Conservar evidencia de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primas-sugese-verificacion
          path: data/series_powerbi.json
          retention-days: 7
